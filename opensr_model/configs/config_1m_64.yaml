# Config for 10m S1+S2 → 1m aerial super-resolution — 64×64 latent variant
# Aerial tiles: 1000×1000 at 1m, padded to 1024×1024
# S1/S2 tiles:  100×100 at 10m, padded to 128×128
# Computational scale_factor: 1024 / 64 = 16
# VAE compression: ch_mult [1,2,4,8,8] → 4 downsamples → 16× → 64×64 latent
# Channels capped at 1024 (ch×16) to match 128-latent config VRAM usage

# General Settings
apply_normalization: False
encode_conditioning: True
scale_factor: 16

# Diffusion and Sampling Settings
denoiser_settings:
  linear_start: 0.0001
  linear_end: 0.01
  timesteps: 1000
  parameterization: "eps"
  sampling_eta: 0.95
  sampling_temperature: 1.0
  sampling_steps: 100

# Autoencoder Settings
first_stage_config:
  embed_dim: 4
  double_z: true
  z_channels: 4
  resolution: 1024
  in_channels: 4
  out_ch: 4
  ch: 64
  ch_mult: [1, 2, 4, 8, 16]
  num_res_blocks: 2
  attn_resolutions: []
  dropout: 0.0

# Denoising UNet Settings
cond_stage_config:
  image_size: 64
  in_channels: 10
  model_channels: 160
  out_channels: 4
  num_res_blocks: 2
  attention_resolutions: [8, 4]
  channel_mult: [1, 2, 2, 4]
  num_head_channels: 32

# other settings
other:
  concat_mode: True
  cond_stage_trainable: False
  first_stage_key: "image"
  cond_stage_key: "LR_image"
