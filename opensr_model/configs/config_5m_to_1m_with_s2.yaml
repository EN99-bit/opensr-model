# Config for 5m aerial → 1m aerial super-resolution (5m aerial + S1 + S2 conditioning)
# Aerial tiles: 1000×1000 at 1m, padded to 1024×1024
# 5m aerial:    200×200 at 5m,  padded to 256×256
# S1/S2:        100×100 at 10m, padded to 128×128
# VAE compression: ch_mult [1,2,4,8] → 3 downsamples → 8× → 128×128 latent

# General Settings
apply_normalization: False
encode_conditioning: True
scale_factor: 8

# Diffusion and Sampling Settings
denoiser_settings:
  linear_start: 0.0001
  linear_end: 0.01
  timesteps: 1000
  parameterization: "eps"
  sampling_eta: 0.95
  sampling_temperature: 1.0
  sampling_steps: 100

# Autoencoder Settings
first_stage_config:
  embed_dim: 4
  double_z: true
  z_channels: 4
  resolution: 1024
  in_channels: 4
  out_ch: 4
  ch: 128
  ch_mult: [1, 2, 4, 8]
  num_res_blocks: 2
  attn_resolutions: []
  dropout: 0.0

# Denoising UNet Settings — 14 channels: 4 noise + 4 aerial + 2 S1 + 4 S2
cond_stage_config:
  image_size: 128
  in_channels: 14
  model_channels: 160
  out_channels: 4
  num_res_blocks: 2
  attention_resolutions: [16, 8]
  channel_mult: [1, 2, 2, 4]
  num_head_channels: 32
  use_checkpoint: false

# other settings
other:
  concat_mode: True
  cond_stage_trainable: False
  first_stage_key: "image"
  cond_stage_key: "LR_image"
